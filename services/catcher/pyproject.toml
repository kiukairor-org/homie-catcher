[project]
name = "homie-catcher"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S104", "S108", "S603", "B905", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
